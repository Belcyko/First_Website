<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Nairobi School</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <!-- Navigation Section -->
    <nav>
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Courses</a>
        <a href="">Contact</a>
    </nav>
    <!-- Hero section -->
    <section class="hero_contact">
        <h1>Contact Us</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quos voluptates animi et ea necessitatibus nobis!</p>
    </section>
    <section class="main-section">
        <div class="info">
            <img src="https://images.unsplash.com/photo-1612229693210-30e16029c415?w=400&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
            <h2>Get In Touch</h2>
            <p>Email: info@nairobischool.com</p>
            <p>Phone: +254 700 000 000</p>
            <p>Location: Nairobi, Kenya</p>
        </div>
        <div class="form">
            <form action="">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name='fullname' placeholder="Your Full Name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Your Email" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
</body>
</html>
